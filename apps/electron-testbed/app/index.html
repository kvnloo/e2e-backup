<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Sign In</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 24px; }
      form { display: grid; gap: 12px; max-width: 320px; }
      label { display: grid; gap: 4px; }
      #items { height: 160px; overflow: auto; border: 1px solid #ccc; margin: 0; padding: 0 16px; }
      #items li { padding: 6px 0; }
    </style>
  </head>
  <body>
    <h1 id="greeting">Welcome</h1>
    <div id="badge-host"></div>
    <form id="sign-in">
      <label>Username <input name="username" data-testid="username" autocomplete="username" placeholder="ada" /></label>
      <label>Password <input name="password" type="password" data-testid="password" autocomplete="current-password" /></label>
      <label><input type="checkbox" name="remember" /> Remember me</label>
      <label>Plan
        <select name="plan" data-testid="plan">
          <option>Free</option>
          <option selected>Pro</option>
          <option>Team</option>
          <optgroup label="Retired" disabled><option>Legacy</option></optgroup>
        </select>
      </label>
      <button type="submit" data-testid="sign-in">Sign in</button>
    </form>
    <p role="status" data-testid="status">Not signed in</p>
    <section aria-labelledby="counter-heading">
      <h2 id="counter-heading">Counter</h2>
      <button type="button" id="increment">Add one</button>
      <output data-testid="count">0</output>
      <p data-testid="price"><span>Price</span> <span>$10</span></p>
      <div id="spinner" hidden>Loading</div>
      <ul id="rows">
        <li class="row" id="row-first" data-testid="row" hidden>First row</li>
        <li class="row" id="row-second" data-testid="row">Second row</li>
      </ul>
      <input type="password" id="stashed-key" value="stashed-secret" hidden />
      <div aria-disabled="true"><button type="button" id="locked">Locked action</button></div>
      <fieldset disabled><legend>Archived</legend><a href="#archive" id="archive-link">Open archive</a></fieldset>
      <output data-testid="link-result"></output>
    </section>
    <section aria-labelledby="fields-heading">
      <h2 id="fields-heading">Tricky fields</h2>
      <label>Handoff <input data-testid="handoff" /></label>
      <label>Invite code <input data-testid="invite" /></label>
      <label>Slow <input data-testid="slow" /></label>
      <label>Laggy <input data-testid="laggy" /></label>
      <label>Due <input type="date" data-testid="due" value="2026-01-02" /></label>
      <label>Notes <textarea data-testid="notes">Bring the badge</textarea></label>
      <label>Region
        <select data-testid="region">
          <option value="eu-1">Europe</option>
          <option value="us-1">America</option>
        </select>
      </label>
      <div style="overflow-x: auto"><button type="button" id="wide" style="width: 1500px">Wide action</button></div>
      <output data-testid="wide-result"></output>
    </section>
    <section aria-labelledby="settings-heading">
      <h2 id="settings-heading">Windows</h2>
      <button type="button" id="open-settings">Open settings</button>
    </section>
    <section aria-labelledby="items-heading">
      <h2 id="items-heading">Items</h2>
      <ul id="items" aria-label="Items" tabindex="0"></ul>
    </section>
    <section aria-labelledby="drag-heading">
      <h2 id="drag-heading">Drag</h2>
      <button type="button" id="drag-source">Drag me</button>
      <output data-testid="drag-result">Nothing dropped</output>
      <div style="height: 1400px"></div>
      <button type="button" id="drop-zone">Drop here</button>
    </section>
    <script src="index.js"></script>
  </body>
</html>
